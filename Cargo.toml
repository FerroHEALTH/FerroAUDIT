[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.5"
edition = "2024"
rust-version = "1.98"
license = "BUSL-1.1"
repository = "https://github.com/FerroHEALTH/FerroAUDIT"
homepage = "https://github.com/FerroHEALTH/FerroAUDIT"
authors = ["Ruben Talstra"]

# The authoritative third-party set. A crate takes a dependency with
# dep.workspace = true, and every version is checked against crates.io on the
# day it is added (.claude/rules/reliability.md). The lines are the ones the
# FerroHEALTH products resolve, so the library adds no second copy to any of
# them. Verified against crates.io on 2026-10-20.
[workspace.dependencies]
# The ITI-20 sender: the DICOM PS3.15 audit message as XML, its timestamps
# and base64 values, the RFC 5425 TLS connection on rustls with the
# platform's roots, the spool on tokio, and the redacting secret type a
# message travels in.
base64 = { version = "0.23.1", default-features = false, features = ["std"] }
jiff = { version = "0.2.38", default-features = false, features = ["std"] }
quick-xml = { version = "0.42.0", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["std", "tls12", "aws_lc_rs"] }
rustls-platform-verifier = "0.7.1"
secrecy = "0.10.3"
thiserror = "2.0.21"
tokio = { version = "1.53.3", default-features = false }
tokio-rustls = { version = "0.26.6", default-features = false }
tracing = "0.1.44"
url = "2.5.8"
# BALP: the FHIR R4 `AuditEvent` and the ATX: FHIR Feed client. fhir-types
# stays on the 0.1.113 line FerroFED and FerroBRIDGE's fhirconnect build on,
# so a product carries one copy.
async-trait = "0.1.92"
fhir-types = { version = "0.1.113", default-features = false }
http = "1.5.0"
reqwest = { version = "0.13.5", default-features = false }
serde_json = "1.0.154"
# The serde form of the access record (ehds-logging), and test-only the JSON
# reader of the written records.
serde = { version = "1.0.229", features = ["derive"] }
# Test-only: the vendored HL7 Europe packages the priority categories are held
# to (flate2, tar), the property tests of the classification map (proptest),
# and the TOML form of the map (toml).
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
proptest = "1.12.0"
tar = { version = "0.4.46", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["std", "parse", "display", "serde"] }
# Test-only: FerroEHR's archetype-id parser, which the category map's
# ARCHETYPE_ID check is held to.
openehr-base = "0.0.93"
# Test-only: the CA and leaf the TLS listener of the repository tests mints at
# run time, on the aws-lc-rs provider rustls already uses.
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
# The workspace's own crates, each at the workspace version.
ihe-atna = { path = "crates/ihe-atna", version = "=0.2.5" }
# Test-only: the spool directories, the log capture of the forwarder tests,
# and the stub FHIR Feed repository.
tempfile = "3.27.0"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["std", "fmt"] }
wiremock = "0.6.5"

# The reliability bar (no specification governs it: our own design), the
# FerroHEALTH family's lint set as FerroBRIDGE, FerroFED and FerroUI carry it.
[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
dead_code = "deny"
let_underscore_drop = "deny"
non_local_definitions = "deny"
unexpected_cfgs = "deny"
unsafe_op_in_unsafe_fn = "deny"
ffi_unwind_calls = "deny"
deprecated_safe_2024 = "deny"
ambiguous_negative_literals = "deny"
unused_must_use = "deny"
macro_use_extern_crate = "warn"
absolute_paths_not_starting_with_crate = "warn"
unit_bindings = "warn"
meta_variable_misuse = "warn"
explicit_outlives_requirements = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_macro_rules = "warn"
unused_qualifications = "warn"
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
missing_crate_level_docs = "warn"
invalid_codeblock_attributes = "deny"
invalid_rust_codeblocks = "deny"
invalid_html_tags = "deny"
bare_urls = "deny"
redundant_explicit_links = "deny"
unescaped_backticks = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Panics are for states that cannot happen; everything else is a Result.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
unimplemented = "deny"
todo = "deny"
panic_in_result_fn = "deny"
missing_assert_message = "deny"
indexing_slicing = "deny"
string_slice = "deny"
# Numeric honesty: no silent narrowing, wrapping, or lossy literals.
as_conversions = "deny"
float_cmp_const = "deny"
lossy_float_literal = "deny"
as_underscore = "deny"
fn_to_numeric_cast_any = "deny"
precedence_bits = "deny"
suspicious_xor_used_as_pow = "deny"
integer_division = "warn"
unchecked_time_subtraction = "deny"
# Guards, results, and causes are never dropped on the floor.
let_underscore_must_use = "deny"
let_underscore_untyped = "deny"
unused_result_ok = "deny"
map_err_ignore = "warn"
await_holding_lock = "deny"
# Determinism: hash iteration order feeds nothing that must be stable.
iter_over_hash_type = "deny"
# Libraries speak tracing; only binaries write to stdio, and nothing exits.
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
exit = "deny"
# Suppressions are scoped, justified, and self-reporting.
allow_attributes_without_reason = "deny"
allow_attributes = "warn"
# Documentation and comment shape (RFC 505 and RFC 1574).
too_long_first_doc_paragraph = "warn"
unnecessary_safety_comment = "deny"
unnecessary_safety_doc = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
# The RFC 3107 shape: derive Default when the default is a variant.
derivable_impls = "deny"
# API hygiene: no re-exports, no pointer leakage, the right std call.
pub_use = "deny"
incompatible_msrv = "deny"
verbose_file_reads = "deny"
filetype_is_file = "deny"
create_dir = "deny"
large_include_file = "deny"
rc_buffer = "deny"
rc_mutex = "deny"
mem_forget = "deny"
pointer_format = "deny"
empty_drop = "warn"
deref_by_slicing = "warn"

# A clean 500 relies on catch_unwind, which only catches unwinding panics, and
# tests ignore the panic setting, so abort would be untestable
# (https://doc.rust-lang.org/cargo/reference/profiles.html#panic).
[profile.release]
panic = "unwind"
overflow-checks = true
debug = "line-tables-only"
