# ITI-81 by patient over the 10000 records of the corpus, ten matches a page
# (ITI TF-2 §3.81.4.1).
[[requests]]
group = "iti-81"
method = "GET"
path = "/fhir/AuditEvent?patient.identifier=urn:oid:2.999.2%7CQz7-p-{{patient}}&date=ge2026-01-01&_count=10"
status = 200

# One ITI-20 DICOM audit message written, spooled on disk and forwarded over
# RFC 5425 TLS to the repository's syslog receiver, which spools it again and
# keeps it (ITI TF-2 §3.20.4.1); the answer comes once the sender's spool
# stored it.
[[requests]]
group = "iti-20-syslog"
method = "POST"
path = "/syslog"
status = 202
body = "Qz7-p-{{patient}}"
headers = { content-type = "text/plain" }
