name: Feature request
description: Propose a capability or an improvement.
type: Feature
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: The product or the deployment that needs it, and why.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What the library does, and which layer (the audit message, the syslog transport, the spool and the forwarder, the BALP records, the FHIR Feed) it changes.
    validations:
      required: true
  - type: textarea
    id: standard
    attributes:
      label: Specification reference
      description: The ITI-20 section, the RESTful ATNA supplement section or the BALP pattern this relates to, if any.
    validations:
      required: false
