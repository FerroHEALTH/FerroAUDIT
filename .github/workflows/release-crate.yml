# The reusable crate lane release.yml calls: package ihe-atna and
# ehds-logging with no build cache, attest each .crate through Sigstore, and
# attach each file, its checksum and its attestation bundle to the draft
# release. A reusable
# workflow keeps the signing identity out of reach of caller-defined steps
# (SLSA v1.0 Build Level 3; GitHub, "Using artifact attestations and reusable
# workflows to achieve SLSA v1 Build Level 3").
name: Release crate

on:
  workflow_call:
    inputs:
      tag:
        description: The vX.Y.Z tag being released.
        required: true
        type: string
      version:
        description: The version the tag names.
        required: true
        type: string

permissions: {}

jobs:
  crate:
    name: package and attest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # attach the assets to the draft release
      id-token: write # Sigstore
      attestations: write # store the attestation against this repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache: "false"
      # One `cargo package --workspace` packages both members, ehds-logging
      # against the ihe-atna it was packaged beside.
      - name: Package the crates
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          cargo package --workspace --locked
          for name in ihe-atna ehds-logging; do
            crate="target/package/${name}-${VERSION}.crate"
            test -s "$crate"
            cp "$crate" .
            sha256sum "${name}-${VERSION}.crate" > "${name}-${VERSION}.crate.sha256sum"
          done
      - id: attest-ihe-atna
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ihe-atna-${{ inputs.version }}.crate
      - id: attest-ehds-logging
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ehds-logging-${{ inputs.version }}.crate
      - name: Attach the crates, their checksums and their attestations
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          ATNA_BUNDLE: ${{ steps.attest-ihe-atna.outputs.bundle-path }}
          EHDS_BUNDLE: ${{ steps.attest-ehds-logging.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$ATNA_BUNDLE" "ihe-atna-${VERSION}.crate.sigstore.json"
          cp "$EHDS_BUNDLE" "ehds-logging-${VERSION}.crate.sigstore.json"
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber \
            "ihe-atna-${VERSION}.crate" \
            "ihe-atna-${VERSION}.crate.sha256sum" \
            "ihe-atna-${VERSION}.crate.sigstore.json" \
            "ehds-logging-${VERSION}.crate" \
            "ehds-logging-${VERSION}.crate.sha256sum" \
            "ehds-logging-${VERSION}.crate.sigstore.json"
