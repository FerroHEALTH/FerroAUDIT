# CI in six jobs and the conclusion (no specification governs this: our own
# design).
#
#   1. `guards` runs the workflow, shell and repository guards, the publish
#      dry run and the MSRV build, all without a build cache.
#   2. `lint` runs rustfmt, clippy with no feature, with `atna` and with
#      every feature, rustdoc and cargo-deny over one build cache.
#   3. `nextest (each feature set)` runs the tests and the doctests.
#   4. `cargo-semver-checks` runs on a pull request.
#   5. `conformance` runs the HL7 FHIR Validator over the BALP records the
#      tests write.
#   6. `perf` runs the performance gate (perf.yml) where a change reaches
#      `ihe-atna`, the harness or the gate.
#
# Every job starts at once and pays one runner queue wait: the hosted runner
# pool is shared across the organisation, so each job pays the wait for a
# runner however short its work, and a job that waits on another pays it
# twice (#190). Each guard step runs when an earlier one failed, so a run
# still reports every finding.
#
# A merge group runs the light set: the guards without the publish dry run
# and the MSRV build, rustfmt and cargo-deny without clippy and rustdoc, and
# every test target compiled with every feature and the unit tests run. The
# pull request ran the full suite on the same change.
#
# The vendored-specification guard runs in specs.yml beside this workflow.
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited` started a second run on the same commit, the
    # concurrency group cancelled the first, and its `conclusion` reported a
    # failure on the head commit (#73).
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Guards, no build cache ------------------------------------------------
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The crate version guard compares the pull request's base and head.
          fetch-depth: 0
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: zizmor@1.31.1,shellcheck@0.11.0
      - name: zizmor audits .github
        if: ${{ !cancelled() }}
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/
      - name: actionlint lints .github/workflows
        if: ${{ !cancelled() }}
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      - name: Every tracked shell program is clean at severity=style
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style
      - name: The release milestone script refuses open items and closes only after every leg
        if: ${{ !cancelled() }}
        run: bash scripts/release/milestone.sh --self-test
      - name: The release plan orders tags by version and counts the support period
        if: ${{ !cancelled() }}
        run: bash scripts/release/plan.sh --self-test
      - name: The changelog Security check passes and refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-security.sh --self-test
      - name: The tracker helpers touch nothing on a usage error and call each endpoint once
        if: ${{ !cancelled() }}
        run: |
          bash scripts/gh/fields.sh --self-test
          bash scripts/gh/rel.sh --self-test
      # Every section of CHANGELOG.md holds Keep a Changelog types each once, and
      # [Unreleased] keeps the Security rules the release plan checks on the
      # section it cuts (no specification governs the wiring: our own design).
      - name: The changelog keeps its structure
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-structure.sh
      # Regulation (EU) 2024/2847 Annex I Part II(2), (4) and (8): every
      # Security entry names its GHSA advisory or VEX statement, and a
      # Security section beside other changes opens with its reason.
      - name: Unreleased keeps the Security rules
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-security.sh --section Unreleased
      - name: Comment style
        if: ${{ !cancelled() }}
        run: bash scripts/checks/comment-style.sh --all
      - name: No conformance badge claims a certification
        if: ${{ !cancelled() }}
        run: bash scripts/checks/conformance.sh --labels
      - name: The performance gate resolves its base and bootstraps a base without the harness
        if: ${{ !cancelled() }}
        run: bash scripts/perf/gate.sh --self-test
      - name: The post-quantum inventory, its table and its badge agree
        if: ${{ !cancelled() }}
        run: |
          bash scripts/checks/post-quantum.sh --self-test
          bash scripts/checks/post-quantum.sh --check
      # Every TODO(#N) names an open issue.
      - name: Every pending-work pointer names an open issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh
      - name: The guard reads files larger than a pipe buffer
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: bash scripts/checks/crate-version-guard.sh --self-test
      - name: The version, the lock and the changelog agree
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      # No cache from here on: the dry run checks the bytes a publish would
      # upload.
      - uses: ./.github/actions/setup-rust
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        with:
          cache: "false"
      - name: Publish dry run
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        run: cargo publish --workspace --dry-run --locked
      # The declared MSRV is the floor a consuming product builds on, so every
      # target is built with it, read from the manifest, with no feature, with
      # atna and with every feature.
      - name: Install the toolchain the manifest declares as its rust-version
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(awk '/^\[workspace\.package\]/{p=1; next} /^\[/{p=0}
            p && /^rust-version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' Cargo.toml)"
          [ -n "$msrv" ] || { echo "Cargo.toml declares no rust-version"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          echo "toolchain=$msrv" >> "$GITHUB_OUTPUT"
      - name: Every target builds on the MSRV with no feature, with atna and with every feature
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        env:
          MSRV: ${{ steps.msrv.outputs.toolchain }}
        run: |
          set -euo pipefail
          cargo "+$MSRV" check --workspace --all-targets --locked
          cargo "+$MSRV" check --workspace --all-targets --features atna --locked
          cargo "+$MSRV" check --workspace --all-targets --all-features --locked

  # ---- Rust ------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-deny
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      # The crate compiles with no feature (the `user` module), with the
      # syslog sender alone, and with BALP and the FHIR Feed, so each is
      # linted.
      - if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        run: cargo clippy --workspace --all-targets --features atna --locked -- -D warnings
      - if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: rustdoc
        if: ${{ !cancelled() && github.event_name != 'merge_group' }}
        run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: cargo deny check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        if: ${{ !cancelled() }}
        run: bash scripts/checks/advisory-exceptions.sh

  test:
    name: nextest (each feature set)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - if: github.event_name != 'merge_group'
        run: cargo nextest run --workspace --locked
      - if: github.event_name != 'merge_group'
        run: cargo nextest run --workspace --features atna --locked
      - if: github.event_name != 'merge_group'
        run: cargo nextest run --workspace --all-features --locked
      - if: github.event_name != 'merge_group'
        run: cargo test --doc --workspace --all-features --locked
      # The merge group's smoke set: the pull request ran every suite, so the
      # queue compiles every test target with every feature and runs only the
      # unit tests.
      - if: github.event_name == 'merge_group'
        run: |
          set -euo pipefail
          cargo nextest run --workspace --all-features --no-run --locked
          cargo nextest run --workspace --lib --bins --all-features --locked --no-tests=pass

  # Every crate's public API against its newest version on crates.io, on the
  # default feature set and on --only-explicit-features: a break, or a public
  # dependency on another line, that the manifest version does not answer
  # with a minor bump fails (scripts/checks/semver.sh, #204).
  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: "false"
      - id: pin
        name: Read the cargo-semver-checks pin
        run: echo "version=$(bash scripts/checks/semver.sh --pin)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-semver-checks@${{ steps.pin.outputs.version }}
      - run: bash scripts/checks/semver.sh

  # The HL7 FHIR Validator over every BALP AuditEvent the ehds-logging tests
  # write, held to the pattern each claims (#279; scripts/checks/fhir-validator.sh),
  # and the README's conformance badges held to this run's counts (#280).
  # The jar and the packages are pinned in docs/VERSIONS.md and cached.
  conformance:
    name: conformance
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519 # v2.90.5
        with:
          tool: cargo-nextest
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: The validator lane judges as it claims
        run: bash scripts/checks/fhir-validator.sh --self-test
      - name: The badges count as they claim
        run: bash scripts/checks/conformance.sh --self-test
      - name: Read the pinned validator downloads
        id: validator
        run: echo "key=$(bash scripts/checks/fhir-validator.sh --cache-key)" >> "$GITHUB_OUTPUT"
      - name: Restore the validator downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            target/hl7-validator/*.tgz
            target/hl7-validator/validator_cli.jar
          key: hl7-validator-${{ steps.validator.outputs.key }}
      - name: Write the BALP records and the conformance tests' report
        env:
          BALP_EMIT_DIR: ${{ runner.temp }}/balp-records
        run: >-
          cargo nextest run --workspace --all-features --locked --profile conformance
          -E '(package(ehds-logging) & test(/^balp::/)) | (package(ihe-atna) & test(/^(arr::search|balp::patterns)::/))'
      - name: Validate the BALP records
        env:
          RECORDS: ${{ runner.temp }}/balp-records
          OUT: ${{ runner.temp }}/balp-validation
        run: |
          set -euo pipefail
          status=0
          bash scripts/checks/fhir-validator.sh "$RECORDS" "$OUT" || status=$?
          cat "$OUT/summary.md" >> "$GITHUB_STEP_SUMMARY" || true
          exit "$status"
      # The README's conformance badges are the counts of this run: a badge file
      # that differs fails until scripts/checks/conformance.sh --write updates it.
      - name: The conformance badges hold this run's counts
        env:
          OUT: ${{ runner.temp }}/balp-validation
        run: bash scripts/checks/conformance.sh --check target/nextest/conformance/junit.xml "$OUT"
      - name: Upload the validation results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: balp-validation
          path: |
            ${{ runner.temp }}/balp-validation/
            target/nextest/conformance/junit.xml
          if-no-files-found: warn
          retention-days: 7

  # ---- The performance gate -------------------------------------------------
  # Whether the change reaches what the performance gate measures (#331):
  # every push and dispatch, and a pull request or merge group that changes
  # `ihe-atna`, the harness, the manifests or what the gate reads.
  perf-reach:
    name: perf reach
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.reach.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - id: reach
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != pull_request ] && [ "$EVENT" != merge_group ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=false
          while IFS= read -r path; do
            case "$path" in
              crates/ihe-atna/src/* | crates/ihe-atna/Cargo.toml | tools/perf-arr/* | perf/* | scripts/perf/* | \
                Cargo.toml | Cargo.lock | rust-toolchain.toml | docs/VERSIONS.md | .github/workflows/ci.yml | \
                .github/workflows/perf.yml | .github/actions/perf-attempt/* | .github/actions/setup-rust/*)
                echo "reaches the performance gate: $path"
                run=true
                ;;
              *) ;;
            esac
          done < <(git diff --name-only "$BASE...$HEAD")
          echo "run=$run" >> "$GITHUB_OUTPUT"

  # The performance gate (#331): ferrohealth-perf's A/B mode, the release
  # build of the harness judged against the build over its base on the same
  # runner, in perf.yml, which the release lane calls on the release commit
  # against the previous release. The base is the pull request's base or the
  # commit before a push. A merge group builds nothing for it and its
  # verdict passes with a summary saying why.
  perf:
    name: perf
    needs: perf-reach
    if: needs.perf-reach.outputs.run == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/perf.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
      skip: ${{ github.event_name == 'merge_group' }}

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - guards
      - lint
      - test
      - semver
      - conformance
      - perf-reach
      - perf
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
