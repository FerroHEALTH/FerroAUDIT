# CI in four jobs and the conclusion (no specification governs this: our own
# design).
#
#   1. `guards` runs the workflow, shell and repository guards, the publish
#      dry run and the MSRV build, all without a build cache.
#   2. `lint` runs rustfmt, clippy with no feature, with `atna` and with
#      every feature, rustdoc and cargo-deny over one build cache.
#   3. `nextest (each feature set)` runs the tests and the doctests.
#   4. `cargo-semver-checks` runs on a pull request and in the merge queue.
#
# Every job starts at once and pays one runner queue wait: the hosted runner
# pool is shared across the organisation, so each job pays the wait for a
# runner however short its work, and a job that waits on another pays it
# twice (#190). Each guard step runs when an earlier one failed, so a run
# still reports every finding.
#
# The vendored-specification guard runs in specs.yml beside this workflow.
# The `conclusion` job is the single required status check on main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Only the activity types that change the code under test, so a commit
    # gets one run: `edited` started a second run on the same commit, the
    # concurrency group cancelled the first, and its `conclusion` reported a
    # failure on the head commit (#73).
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  # ---- Guards, no build cache ------------------------------------------------
  guards:
    name: guards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The crate version guard compares the pull request's base and head.
          fetch-depth: 0
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: zizmor@1.31.1,shellcheck@0.11.0
      - name: zizmor audits .github
        if: ${{ !cancelled() }}
        # GH_TOKEN enables the online audits (impostor-commit verifies every
        # pinned commit belongs to the repository it names).
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --min-severity=low .github/
      - name: actionlint lints .github/workflows
        if: ${{ !cancelled() }}
        # The official image, digest-pinned; it bundles the shellcheck that
        # reads every run: block. SC2016 is excluded alone: every occurrence
        # here is a jq filter or a printf format.
        run: |
          docker run --rm \
            -v "$PWD:/repo" --workdir /repo \
            -e SHELLCHECK_OPTS='-e SC2016' \
            rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 \
            -color
      - name: Every tracked shell program is clean at severity=style
        if: ${{ !cancelled() }}
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck --severity=style
      - name: The release milestone script refuses open items and closes only after every leg
        if: ${{ !cancelled() }}
        run: bash scripts/release/milestone.sh --self-test
      - name: The release plan orders tags by version and counts the support period
        if: ${{ !cancelled() }}
        run: bash scripts/release/plan.sh --self-test
      - name: The changelog Security check passes and refuses what it claims to
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-security.sh --self-test
      - name: The tracker helpers touch nothing on a usage error and call each endpoint once
        if: ${{ !cancelled() }}
        run: |
          bash scripts/gh/fields.sh --self-test
          bash scripts/gh/rel.sh --self-test
      # Every section of CHANGELOG.md holds Keep a Changelog types each once, and
      # [Unreleased] keeps the Security rules the release plan checks on the
      # section it cuts (no specification governs the wiring: our own design).
      - name: The changelog keeps its structure
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-structure.sh
      # Regulation (EU) 2024/2847 Annex I Part II(2), (4) and (8): every
      # Security entry names its GHSA advisory or VEX statement, and a
      # Security section beside other changes opens with its reason.
      - name: Unreleased keeps the Security rules
        if: ${{ !cancelled() }}
        run: bash scripts/checks/changelog-security.sh --section Unreleased
      - name: Comment style
        if: ${{ !cancelled() }}
        run: bash scripts/checks/comment-style.sh --all
      # Every TODO(#N) names an open issue.
      - name: Every pending-work pointer names an open issue
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/checks/todo-issues.sh
      - name: The guard reads files larger than a pipe buffer
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: bash scripts/checks/crate-version-guard.sh --self-test
      - name: The version, the lock and the changelog agree
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/checks/crate-version-guard.sh "$BASE" "$HEAD"
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
      # No cache from here on: the dry run checks the bytes a publish would
      # upload.
      - uses: ./.github/actions/setup-rust
        if: ${{ !cancelled() }}
        with:
          cache: "false"
      - name: Publish dry run
        if: ${{ !cancelled() }}
        run: cargo publish --workspace --dry-run --locked
      # The declared MSRV is the floor a consuming product builds on, so every
      # target is built with it, read from the manifest, with no feature, with
      # atna and with every feature.
      - name: Install the toolchain the manifest declares as its rust-version
        if: ${{ !cancelled() }}
        id: msrv
        run: |
          set -euo pipefail
          msrv="$(awk '/^\[workspace\.package\]/{p=1; next} /^\[/{p=0}
            p && /^rust-version[[:space:]]*=/{gsub(/.*=[[:space:]]*"|".*/, ""); print; exit}' Cargo.toml)"
          [ -n "$msrv" ] || { echo "Cargo.toml declares no rust-version"; exit 1; }
          rustup toolchain install "$msrv" --profile minimal
          echo "toolchain=$msrv" >> "$GITHUB_OUTPUT"
      - name: Every target builds on the MSRV with no feature, with atna and with every feature
        if: ${{ !cancelled() }}
        env:
          MSRV: ${{ steps.msrv.outputs.toolchain }}
        run: |
          set -euo pipefail
          cargo "+$MSRV" check --workspace --all-targets --locked
          cargo "+$MSRV" check --workspace --all-targets --features atna --locked
          cargo "+$MSRV" check --workspace --all-targets --all-features --locked

  # ---- Rust ------------------------------------------------------------------
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          components: rustfmt,clippy
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-deny
      - name: rustfmt
        if: ${{ !cancelled() }}
        run: cargo fmt --all --check
      # The crate compiles with no feature (the `user` module), with the
      # syslog sender alone, and with BALP and the FHIR Feed, so each is
      # linted.
      - if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --features atna --locked -- -D warnings
      - if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: rustdoc
        if: ${{ !cancelled() }}
        run: cargo doc --locked --workspace --all-features --no-deps --document-private-items
      - name: cargo-deny
        if: ${{ !cancelled() }}
        run: cargo deny check
      # An `ignore` entry that outlived its finding: cargo-deny reports it as a
      # warning, so the step above stays green on one; this promotes it to an
      # error. Here because cargo-deny and the toolchain are installed.
      - name: No exception for an advisory that no longer fires
        if: ${{ !cancelled() }}
        run: bash scripts/checks/advisory-exceptions.sh

  test:
    name: nextest (each feature set)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-nextest
      - run: cargo nextest run --workspace --locked
      - run: cargo nextest run --workspace --features atna --locked
      - run: cargo nextest run --workspace --all-features --locked
      - run: cargo test --doc --workspace --all-features --locked

  # Every crate's public API against its newest version on crates.io, on the
  # default feature set and on --only-explicit-features: a break, or a public
  # dependency on another line, that the manifest version does not answer
  # with a minor bump fails (scripts/checks/semver.sh, #204).
  semver:
    name: cargo-semver-checks
    if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-rust
        with:
          cache-save-if: "false"
      - id: pin
        name: Read the cargo-semver-checks pin
        run: echo "version=$(bash scripts/checks/semver.sh --pin)" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@b80e2bb2635f28eb98b9fce1e2f0887e1535c6b2 # v2.90.0
        with:
          tool: cargo-semver-checks@${{ steps.pin.outputs.version }}
      - run: bash scripts/checks/semver.sh

  # ---- The single required check --------------------------------------------
  # It needs every other job and runs on always(), so it reports even when a
  # gated tier is skipped; it fails when a needed job failed or was cancelled.
  conclusion:
    name: conclusion
    needs:
      - guards
      - lint
      - test
      - semver
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every required job passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "needed job results: ${RESULTS}"
          case " ${RESULTS} " in
            *" failure "* | *" cancelled "*)
              echo "a required job failed or was cancelled"
              exit 1
              ;;
          esac
          echo "all required jobs passed or were skipped"
