# SonarQube Cloud project configuration.
#
# Advisory analysis only: it never outranks the specifications, the project
# rules, or the local gates, and it gates no merge
# (.claude/rules/ai-code-review.md). The quality gate is the built-in
# "Sonar way" default.

sonar.projectKey=FerroHEALTH_FerroAUDIT
sonar.organization=ferrohealth
sonar.projectName=FerroAUDIT
sonar.sourceEncoding=UTF-8

# Scope: the whole hand-written tree, the Rust workspace with the shell under
# scripts/ and .claude/hooks/ and the workflow YAML, minus three trees:
#   docs/specs/**     the vendored specification corpora, bytes a publisher
#                     owns and scripts/vendor/*.sh reproduces
#                     (.claude/rules/vendored-inputs.md), never edited here.
#   target/**         Cargo's build output.
#   .vendor-cache/**  the local copies of material that may not be
#                     redistributed, git-ignored and never committed.
# scripts/vendor/ holds the hand-written fetch scripts and stays in scope.
sonar.sources=.
sonar.exclusions=docs/specs/**,target/**,.vendor-cache/**

# Rust coverage, imported from the instrumented nextest run that
# .github/workflows/sonar.yml writes.
sonar.rust.lcov.reportPaths=lcov.info

# Coverage scope: cargo-llvm-cov reports no line of a test target, so the
# integration test trees would read as wholly uncovered. They stay analyzed
# for issues and duplication; only their line coverage is left out.
sonar.coverage.exclusions=**/tests/**

# sonar.projectVersion is appended by the workflow at scan time from the
# workspace version, never kept as a second hand-maintained copy here.
