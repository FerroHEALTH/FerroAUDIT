[package]
name = "ihe-atna"
description = "The IHE audit trail in Rust: the ATNA Record Audit Event sender (ITI-20) with the DICOM audit message, syslog over TLS, a store-and-forward spool and a forwarder, and the BALP AuditEvent sent over the ATX: FHIR Feed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/ihe-atna"
publish = true
readme = "README.md"
keywords = ["ihe", "atna", "audit", "fhir", "syslog"]
categories = ["api-bindings", "science"]
include = ["src/**", "tests/**", "README.md"]

# One feature per layer (no specification governs this: our own design). The
# crate depends on no product.
[features]
# ATNA, the audit trail (ITI-20): the DICOM PS3.15 audit message, the RFC 5424
# syslog message it travels in, the RFC 5425 TLS connection to an Audit
# Record Repository on rustls with the platform's roots, and the bounded
# store-and-forward spool and forwarder ITI-20 requires of a sender.
atna = [
  "dep:async-trait",
  "dep:base64",
  "dep:jiff",
  "dep:quick-xml",
  "dep:rustls",
  "dep:rustls-platform-verifier",
  "dep:secrecy",
  "dep:thiserror",
  "dep:tokio",
  "dep:tokio-rustls",
  "dep:tracing",
  "dep:url",
]
# The bound on an audited exchange's record (`balp::recording`), alone, for a
# client that audits through its own model, such as a profile crate's
# ITI-55 writer.
recording = ["dep:thiserror", "dep:tokio"]
# The Debug rendering of a URL with its credential redacted
# (`redact::RedactedUrl`) and the URL of an interaction under a FHIR base
# (`fhir_base`), alone, for a client that logs URLs it does not audit.
redact = ["dep:url"]
# BALP, the Basic Audit Log Patterns: the FHIR R4 AuditEvent an IHE FHIR
# transaction is audited as, and the ATX: FHIR Feed Option of ITI-20 that
# posts it to an Audit Record Repository through the same spool and
# forwarder. It builds without the syslog sender, the DICOM message and the
# RFC 5425 TLS stack (owner decision of 2026-10-20): the Feed is an HTTP
# create, and its TLS backend is the one the caller builds its
# reqwest::Client with.
balp = [
  "dep:async-trait",
  "dep:base64",
  "dep:jiff",
  "dep:secrecy",
  "dep:thiserror",
  "dep:tokio",
  "dep:tracing",
  "dep:url",
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:http",
  "dep:reqwest",
  "dep:serde_json",
]
# Retrieve ATNA Audit Event (ITI-81): the query an Audit Consumer sends, read
# into typed criteria over the FHIR R4 AuditEvent search parameters, and the
# searchset Bundle and refusal OperationOutcome a repository answers with,
# as fhir-types resources. The repository keeps its store and its query.
retrieve = [
  "dep:fhir-types",
  "fhir-types/r4",
  "fhir-types/resources",
  "dep:jiff",
  "dep:percent-encoding",
  "dep:thiserror",
]
# The bearer token of ferrohealth-smart's client credentials grant as the
# Credentials source of a FHIR Feed repository (`atna::bearer`), so a product
# writes no adapter of its own.
smart = ["balp", "dep:ferrohealth-smart"]

[dependencies]
async-trait = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
ferrohealth-smart = { workspace = true, optional = true }
fhir-types = { workspace = true, optional = true }
http = { workspace = true, optional = true }
jiff = { workspace = true, optional = true }
percent-encoding = { workspace = true, optional = true }
quick-xml = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustls = { workspace = true, optional = true }
rustls-platform-verifier = { workspace = true, optional = true }
secrecy = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util", "macros", "net", "rt", "sync", "time"] }
tokio-rustls = { workspace = true, optional = true, features = ["tls12", "aws_lc_rs"] }
tracing = { workspace = true, optional = true }
url = { workspace = true, optional = true }

[dev-dependencies]
ferrohealth-smart = { workspace = true }
async-trait = { workspace = true }
base64 = { workspace = true }
jiff = { workspace = true }
rcgen = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "net", "io-util"] }
tokio-rustls = { workspace = true, features = ["tls12", "aws_lc_rs"] }
tracing-subscriber = { workspace = true }
wiremock = { workspace = true }

[lints]
workspace = true
